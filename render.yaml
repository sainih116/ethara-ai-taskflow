services:
  - type: web
    name: ethara-ai-taskflow-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false        # set manually in Render dashboard
      - key: DB_NAME
        value: ethara_ai_taskflow
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard
      - key: JWT_EXPIRY
        value: 24h
      - key: FRONTEND_URL
        sync: false        # set to your Netlify URL after deploy
      - key: UPLOAD_PATH
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: "10485760"
